<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricky Is Great</title>
<meta name="description" content="Original jokes that celebrate Ricky Liang.">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #1d1b18; --muted: #6b655c;
    --accent: #b5651d; --accent-text: #ffffff; --border: #e7e0d5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412; --card: #201d1a; --text: #f1ece4; --muted: #a59d91;
      --accent: #e0954f; --accent-text: #161412; --border: #34302b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.55 Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  header { text-align: center; margin-bottom: 36px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; font-style: italic; }
  .spotlight {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 24px; text-align: center; margin-bottom: 40px;
  }
  #random { font-size: 1.3rem; min-height: 3.2em; margin: 0 0 18px; }
  #style { color: var(--muted); font-size: .85rem; font-family: system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  button {
    font: 600 1rem system-ui, sans-serif; background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 999px; padding: 11px 22px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 40px; }
  h3 { font: 600 .9rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  ol { padding-left: 1.3em; }
  li { margin: 0 0 10px; }
  footer { margin-top: 56px; text-align: center; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ricky Is Great</h1>
    <p class="sub">An ongoing record of verified facts.</p>
  </header>

  <section class="spotlight" aria-live="polite">
    <p id="style">Loading…</p>
    <p id="random"></p>
    <button id="next" type="button">Another one</button>
  </section>

  <div id="batches"></div>

  <footer>
    <a href="https://github.com/rickyliang-us/Ricky-is-great">Source on GitHub</a>
  </footer>
</main>
<script>
  let all = [];
  let last = -1;

  function el(tag, text) {
    const e = document.createElement(tag);
    if (text) e.textContent = text;
    return e;
  }

  function showRandom() {
    if (!all.length) return;
    let i;
    do { i = Math.floor(Math.random() * all.length); } while (all.length > 1 && i === last);
    last = i;
    document.getElementById("style").textContent = all[i].style;
    document.getElementById("random").textContent = all[i].text;
  }

  fetch("/api/jokes")
    .then((r) => r.json())
    .then((batches) => {
      const root = document.getElementById("batches");
      for (const b of batches) {
        root.append(el("h2", b.title));
        for (const s of b.sections) {
          root.append(el("h3", s.title));
          const ol = el("ol");
          for (const j of s.jokes) {
            ol.append(el("li", j));
            all.push({ style: s.title, text: j });
          }
          root.append(ol);
        }
      }
      showRandom();
    })
    .catch(() => {
      document.getElementById("style").textContent = "Couldn't load the jokes. Try refreshing.";
    });

  document.getElementById("next").addEventListener("click", showRandom);
</script>
</body>
</html>
